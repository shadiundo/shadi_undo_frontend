<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  
  <title>Shadi Undo | Responsive Admin Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <style>
    #splash-screen {
      position: fixed;
      top: 0;
      left: 0;
      background: #ffffff;
      display: flex;
      flex-direction: column;
      height: 100%;
      width: 100%;
      align-items: center;
      justify-content: center;
      z-index: 99999;
      opacity: 1;
      transition: opacity 0.3s ease-out;
      overflow: hidden;
    }
    #splash-screen.remove {
      opacity: 0;
      pointer-events: none;
      visibility: hidden;
    }
    .splash-spinner {
      width: 44px;
      height: 44px;
      border: 3.5px solid #eeddd1;
      border-top-color: #CAAA93;
      border-radius: 50%;
      animation: splash-spin 0.8s linear infinite;
    }
    @keyframes splash-spin {
      to { transform: rotate(360deg); }
    }
    #leftside-menu-container a img { height: 130px !important }
  </style>
</head>
<body>
  <div id="root"></div>
  <div id="splash-screen"><div class="splash-spinner"></div></div>
  <script type="module" src="/src/main"></script>
  <script>
    const rootEl = document.querySelector('#root');
    const removeSplash = () => {
      const splash = document.querySelector('#splash-screen');
      if (splash && !splash.classList.contains('remove')) {
        splash.classList.add('remove');
        setTimeout(() => splash.remove(), 350);
      }
    };
    new MutationObserver((mutations, observer) => {
      if (rootEl && rootEl.hasChildNodes()) {
        removeSplash();
        observer.disconnect();
      }
    }).observe(rootEl, { childList: true });
    // Safety fallback: ensure splash never blocks screen for more than 1.5s
    setTimeout(removeSplash, 1500);

    (function() {
      const origPush = history.pushState;
      const origReplace = history.replaceState;
      history.pushState = function() {
        const ret = origPush.apply(this, arguments);
        window.dispatchEvent(new Event('locationchange'));
        return ret;
      };
      history.replaceState = function() {
        const ret = origReplace.apply(this, arguments);
        window.dispatchEvent(new Event('locationchange'));
        return ret;
      };
      window.addEventListener('popstate', () => {
        window.dispatchEvent(new Event('locationchange'));
      });

      let lastPath = location.pathname + location.search + location.hash;
      window.addEventListener('locationchange', () => {
        const current = location.pathname + location.search + location.hash;
        if (current !== lastPath) {
          lastPath = current;
          window.scrollTo({ top: 0, behavior: 'smooth' });
        }
      });
    })();
  </script>
</body>
</html>
