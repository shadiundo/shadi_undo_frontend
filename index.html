<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  
  <title>Shadi Undo | Responsive Admin Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <style>
    #splash-screen {
      position: fixed;
      top: 50%;
      left: 50%;
      background: white;
      display: flex;
      height: 100%;
      width: 100%;
      transform: translate(-50%, -50%);
      align-items: center;
      justify-content: center;
      z-index: 9999;
      opacity: 1;
      transition: all 15s linear;
      overflow: hidden;
    }
    #splash-screen.remove {
      animation: fadeout 0.7s forwards;
      z-index: 0;
    }
    #leftside-menu-container a img { height: 130px !important }
    @keyframes fadeout {
      to {
        opacity: 0;
        visibility: hidden;
      }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <div id="splash-screen">
    <img alt="Logo" class="light" src="/src/assets/images/shaadi-logo.png" style="height: 10%" />
  </div>
  <script type="module" src="/src/main"></script>
  <script>
    const rootEl = document.querySelector('#root')
    new MutationObserver(() => {
      document.querySelector('#splash-screen')?.classList.add('remove');
    }).observe(rootEl, { childList: true });

    (function() {
      const origPush = history.pushState;
      const origReplace = history.replaceState;
      history.pushState = function() {
        const ret = origPush.apply(this, arguments);
        window.dispatchEvent(new Event('locationchange'));
        return ret;
      };
      history.replaceState = function() {
        const ret = origReplace.apply(this, arguments);
        window.dispatchEvent(new Event('locationchange'));
        return ret;
      };
      window.addEventListener('popstate', () => {
        window.dispatchEvent(new Event('locationchange'));
      });

      let lastPath = location.pathname + location.search + location.hash;
      window.addEventListener('locationchange', () => {
        const current = location.pathname + location.search + location.hash;
        if (current !== lastPath) {
          lastPath = current;
          window.scrollTo({ top: 0, behavior: 'smooth' });
        }
      });
    })();
  </script>
</body>
</html>
